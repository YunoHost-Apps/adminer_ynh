packaging_format = 2

id = "adminer"
name = "Adminer"
description.en = "Database management tool"
description.fr = "Gestionnaire de base de données"

version = "6.1.0~ynh1"

maintainers = []

[upstream]
license = "Apache-2.0"
website = "https://www.adminer.org/"
demo = "https://demo.adminer.org/adminer.php?username="
code = "https://github.com/vrana/adminer"
fund = "https://www.patreon.com/jakubvrana"

[integration]
yunohost = ">= 12.1.40"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false
sso = false

disk = "50M"
ram.build = "100M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/adminer"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

    [install.admin]
    type = "user"

[resources]

    [resources.sources]

    [resources.sources.main]
    url = "https://github.com/vrana/adminer/releases/download/v6.1.0/adminer-6.1.0.php"
    sha256 = "95bf24b510b41904446f720f4f1212c9e28b1d523f3df44259480d7a12ea181e"
    rename= "index.php"
    in_subdir = false
    autoupdate.strategy = "latest_github_release"
    autoupdate.asset = "^adminer-(\\d+\\.\\d+\\.\\d+)\\.php$"

    [resources.system_user]

    [resources.install_dir]
    group = "www-data:r-x"

    [resources.permissions]
    main.url = "/"

    [resources.apt]
    packages = "php8.5-mysql, php8.5-sqlite3, php8.5-pgsql"
